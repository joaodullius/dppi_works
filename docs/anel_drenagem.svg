='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>slot 5</text><path d='M323.8,208.0 V186.0 H347.1 V208.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='353.1' y='201.0' fill='#C94F4F' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>head 3: put 0, 1 (slot 2 em curso); não arma (3 &lt; 4)</text><path d='M498.7,208.0 V186.0 H522.0 V208.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='528.0' y='201.0' fill='#C94F4F' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>head 6: put 2..4; arma (6 ≥ 4)</text><path d='M673.6,208.0 V186.0 H696.9 V208.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='623.3' y='201.0' fill='#C94F4F' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>head 2 da volta nova: put 5, 6 (volta antiga) e 0</text><path d='M848.5,208.0 V186.0 H871.9 V208.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='743.0' y='201.0' fill='#C94F4F' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>head 5: put 1..3; arma (5 ≥ 4)</text><path d='M536.6,262.0 V240.0 H551.2 V262.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='409.1' y='255.0' fill='#C94F4F' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>READY da 6 (head = 7): PTR = slot 0 → a transação 7 escreve o slot 0; wrap_last = 6</text><rect x='347.1' y='291.0' width='588.9' height='25' rx='3' fill='#EDF3F8' stroke='#0B1B2B' stroke-width='1.4'/><text x='563.5' y='287.0' fill='#0B1B2B' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>consumidor: k_msgq_get, uma amostra por vez, em ordem; latência ≤ T real (taxa alta: + 1 drenagem para o último slot)</text><rect x='204.7' y='266' width='597.2' height='14' rx='3' fill='white' opacity='0.85'/><text x='503.3' y='277.0' fill='#E8A33D' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>janela do datasheet: logo após READY, antes do próximo START (o hardware reescreve o PTR a cada START)</text><rect x='220.8' y='158' width='968.1' height='14' rx='3' fill='white' opacity='0.85'/><text x='704.9' y='169.0' fill='#1FA971' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>sem CPU: o EasyDMA avança um slot por transação; a volta antiga fica meio anel à frente da nova. Em taxa baixa a drenagem espera 1 transação e entrega também o head−1</text><line x1='510.4' y1='186.0' x2='536.6' y2='236.0' stroke='#566577' stroke-width='1.3' stroke-dasharray='3 3' marker-end='url(#arr)'/><line x1='535.4' y1='78.0' x2='538.3' y2='236.0' stroke='#566577' stroke-width='1.3' stroke-dasharray='3 3' marker-end='url(#arr)'/><line x1='323.8' y1='70' x2='323.8' y2='348' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><text x='327.8' y='362.0' fill='#566577' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>T (APP_DRAIN_PERIOD_US)</text><line x1='498.7' y1='70' x2='498.7' y2='348' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><line x1='673.6' y1='70' x2='673.6' y2='348' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><line x1='848.5' y1='70' x2='848.5' y2='348' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><line x1='178' y1='348' x2='936' y2='348' stroke='#566577' stroke-width='1' marker-end='url(#arr)'/><text x='936' y='362' text-anchor='end' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>tempo</text><rect x='24' y='411