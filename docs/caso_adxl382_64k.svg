'Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>1,0 µs START + 11 µs</text><rect x='415.9' y='230.0' width='100.9' height='24' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='466.4' y='246.0' fill='#2563eb' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>1,0 + 5,5 µs</text><path d='M650.8,70.0 V48.0 H655.4 V70.0' fill='none' stroke='#6b7280' stroke-width='2'/><text x='653.1' y='43.0' fill='#6b7280' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>n+2</text><line x1='650.8' y1='116.0' x2='650.8' y2='94.0' stroke='#2563eb' stroke-width='2'/><line x1='650.8' y1='94.0' x2='844.9' y2='94.0' stroke='#2563eb' stroke-width='2'/><line x1='844.9' y1='116.0' x2='844.9' y2='94.0' stroke='#2563eb' stroke-width='2'/><line x1='844.9' y1='116.0' x2='893.4' y2='116.0' stroke='#2563eb' stroke-width='2'/><path d='M652.3,162.0 V140.0 H657.0 V162.0' fill='none' stroke='#2563eb' stroke-width='2'/><rect x='658.6' y='184.0' width='186.3' height='24' fill='#d1fae5' stroke='#059669' stroke-width='1.5'/><text x='751.7' y='200.0' fill='#059669' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>1,0 µs START + 11 µs</text><rect x='658.6' y='230.0' width='100.9' height='24' fill='#dbeafe' stroke='#2563eb' stroke-width='1.5'/><text x='709.0' y='246.0' fill='#2563eb' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>1,0 + 5,5 µs</text><text x='524.6' y='222.0' fill='#059669' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>folga ≈ 2 µs até o próximo START (medido: 71,4 k/s com 11 B no nRF5340)</text><text x='524.6' y='268.0' fill='#2563eb' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>folga ≈ 8 µs: margem para CSNDUR maior e para o jitter do ODR do sensor</text><path d='M602.3,300.0 V286.0 H658.6 V300.0' fill='none' stroke='#dc2626' stroke-width='2'/><text x='630.4' y='281.0' fill='#dc2626' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>END do slot 2N−1 → START seguinte: ≈ 3 µs a 8 MHz, ≈ 9 µs a 16 MHz</text><text x='524.6' y='314.0' fill='#dc2626' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>por isso o wrap é ISR zero-latency (M33) e o anel tem N slots de folga; LATEST não tem prazo</text><line x1='165.5' y1='30' x2='165.5' y2='376' stroke='#6b7280' stroke-width='1' stroke-dasharray='2 4'/><text x='165.5' y='26.0' fill='#6b7280' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>15,6 µs</text><line x1='408.2' y1='30' x2='408.2' y2='376' stroke='#6b7280' stroke-width='1' stroke-dasharray='2 4'/><text x='408.2' y='26.0' fill='#6b7280' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'></text>
<text x='940' y='398' text-anchor='end' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11'>tempo &#8594;</text>
