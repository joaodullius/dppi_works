' font-weight='600'>4,25 µs</text><path d='M658.5,100.0 V78.0 H663.0 V100.0' fill='none' stroke='#566577' stroke-width='2' stroke-linejoin='round'/><text x='660.7' y='73.0' fill='#566577' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>n+2</text><line x1='658.5' y1='154.0' x2='658.5' y2='132.0' stroke='#0093D0' stroke-width='2'/><line x1='658.5' y1='132.0' x2='852.2' y2='132.0' stroke='#0093D0' stroke-width='2'/><line x1='852.2' y1='154.0' x2='852.2' y2='132.0' stroke='#0093D0' stroke-width='2'/><line x1='852.2' y1='154.0' x2='891.3' y2='154.0' stroke='#0093D0' stroke-width='2'/><path d='M660.0,208.0 V186.0 H664.5 V208.0' fill='none' stroke='#0093D0' stroke-width='2' stroke-linejoin='round'/><rect x='666.0' y='237.0' width='186.2' height='25' rx='3' fill='#E3F5EC' stroke='#1FA971' stroke-width='1.4'/><text x='759.1' y='253.5' fill='#1FA971' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>12,5 µs (11 B + START + CSN)</text><rect x='666.0' y='291.0' width='104.3' height='25' rx='3' fill='#E1F0FA' stroke='#0093D0' stroke-width='1.4'/><text x='718.1' y='307.5' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>7 µs</text><rect x='666.0' y='345.0' width='63.3' height='25' rx='3' fill='#E1F0FA' stroke='#0093D0' stroke-width='1.4'/><text x='697.6' y='361.5' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>4,25 µs</text><rect x='250.4' y='266' width='574.0' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='277.0' fill='#1FA971' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>80 % do barramento, ≈ 3 µs até o próximo START (nRF5340 medido: 71,4 k/s válidos com 11 B a 14 µs)</text><rect x='351.9' y='320' width='371.1' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='331.0' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>45 %: margem para CSNDUR maior e para o jitter do ODR do sensor</text><rect x='270.7' y='374' width='533.4' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='385.0' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>27 %: só na SPIM00 (domínio MCU); a errata 8 não se aplica ao ADXL382 (1º byte 0x23, MSB 0)</text><path d='M433.1,424.0 V410.0 H663.0 V424.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='548.1' y='405.0' fill='#C94F4F' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>prazo = um período (15,6 µs), qualquer que seja o SCK</text><rect x='238.8' y='428' width='597.2' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='439.0' fill='#C94F4F' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>nRF5340: ZLI basta (medido 71,4 k/s a 14 µs); nRF54L15: RRAM standby ou FLPR (wake-up 17 µs &gt; 15,6 µs)</text><line x1='192.9' y1='70' x2='192.9' y2='456' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><text x='196.9' y='470.0' fill='#566577' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>15,6 µs</text><line x1='425.7' y1='70' x2='425.7' y2='456' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><line x1='178' y1='456' x2='936' y2='456' stroke='#566577' stroke-width='1' marker-end='url(#arr)'/><text x='936' y='470' text-anchor='end' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>tempo</text><rect x='24' y='519' width='14' height='9' rx='2' fill='#0093D0'/><text x='43' y='528'