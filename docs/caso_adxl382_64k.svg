-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>1,0 µs START + 11 µs</text><rect x='666.0' y='291.0' width='96.8' height='25' rx='3' fill='#E1F0FA' stroke='#0093D0' stroke-width='1.4'/><text x='714.4' y='307.5' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>1,0 + 5,5 µs</text><rect x='282.3' y='266' width='510.3' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='277.0' fill='#1FA971' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>folga ≈ 2 µs até o próximo START (medido no nRF5340: 71,4 k/s válidos com 11 B a 14 µs)</text><rect x='328.7' y='320' width='417.5' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='331.0' fill='#0093D0' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>folga ≈ 8 µs: margem para CSNDUR maior e para o jitter do ODR do sensor</text><path d='M433.1,370.0 V356.0 H663.0 V370.0' fill='none' stroke='#C94F4F' stroke-width='2' stroke-linejoin='round'/><text x='548.1' y='351.0' fill='#C94F4F' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>RX.READY/STARTED do slot 2N−1 → START seguinte: um período (15,6 µs), qualquer que seja o SCK</text><rect x='233.1' y='374' width='608.8' height='14' rx='3' fill='white' opacity='0.85'/><text x='537.4' y='385.0' fill='#C94F4F' text-anchor='middle' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>wrap logo após STARTED (nRF5340) ou DMA.RX.READY (nRF54L), ISR zero-latency no M33; LATEST não tem prazo</text><line x1='192.9' y1='70' x2='192.9' y2='402' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><text x='196.9' y='416.0' fill='#566577' text-anchor='start' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>15,6 µs</text><line x1='425.7' y1='70' x2='425.7' y2='402' stroke='#566577' stroke-width='1' stroke-dasharray='2 4'/><line x1='178' y1='402' x2='936' y2='402' stroke='#566577' stroke-width='1' marker-end='url(#arr)'/><text x='936' y='416' text-anchor='end' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>tempo</text><rect x='24' y='465' width='14' height='9' rx='2' fill='#0093D0'/><text x='43' y='474' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>periférico (evento/tarefa)</text><rect x='216.60999999999999' y='465' width='14' height='9' rx='2' fill='#1FA971'/><text x='235.60999999999999' y='474' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>EasyDMA / dados</text><rect x='343.385' y='465' width='14' height='9' rx='2' fill='#C94F4F'/><text x='362.385' y='474' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>CPU / interrupção</text><rect x='482.13' y='465' width='14' height='9' rx='2' fill='#566577'/><text x='501.13' y='474' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>sensor / externo</text><rect x='614.89' y='465' width='14' height='9' rx='2' fill='#E8A33D'/><text x='633.89' y='474' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>ponto de atenção</text></svg>