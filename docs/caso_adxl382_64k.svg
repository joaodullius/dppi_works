<svg xmlns='http://www.w3.org/2000/svg' width='960' height='406' viewBox='0 0 960 406'>
<defs><marker id='arr' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#6b7280'/></marker></defs>
<rect width='100%' height='100%' fill='white'/>
<text x='20' y='26' fill='#1f2937' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='16'>Caso ADXL382 — data-ready a 64 kHz (INT0 → GPIOTE → DPPI → SPIM), esperado</text>
<text x='20' y='44' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>Período 15,6 µs; rajada STATUS0..ZDATA_L = 1 + 10 bytes: 11 µs a 8 MHz (86 % do barramento) ou 5,5 µs a 16 MHz (SPIM4 do nRF5340)</text>
<line x1='150' y1='70' x2='940' y2='70' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='64' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>amostra ADXL382 (64 kHz)</text><line x1='150' y1='116' x2='940' y2='116' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='110' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>INT0 (DATA_READY)</text><line x1='150' y1='162' x2='940' y2='162' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='156' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>GPIOTE IN → DPPI</text><line x1='150' y1='208' x2='940' y2='208' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='202' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>SPIM 8 MHz: 11 B</text><line x1='150' y1='254' x2='940' y2='254' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='248' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>SPIM 16 MHz: 11 B</text><line x1='150' y1='300' x2='940' y2='300' stroke='#e5e7eb' stroke-width='1'/><text x='142' y='294' text-anchor='end' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>prazo do wrap (QUEUE)</text>
