<svg xmlns='http://www.w3.org/2000/svg' width='960' height='482' viewBox='0 0 960 482'><defs><marker id='arr' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0.5 L8,4.5 L0,8.5 z' fill='#566577'/></marker><marker id='arr-blue' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0.5 L8,4.5 L0,8.5 z' fill='#0093D0'/></marker><marker id='arr-green' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0.5 L8,4.5 L0,8.5 z' fill='#1FA971'/></marker><marker id='arr-red' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0.5 L8,4.5 L0,8.5 z' fill='#C94F4F'/></marker><filter id='shadow' x='-5%' y='-5%' width='110%' height='120%'><feDropShadow dx='0' dy='1.5' stdDeviation='1.5' flood-color='#00224E' flood-opacity='0.12'/></filter></defs><rect width='100%' height='100%' fill='white'/><text x='24' y='30' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='600'>Caso ADXL382 — data-ready a 64 kHz (INT0 → GPIOTE → DPPI → SPIM), esperado</text><text x='24' y='50' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5'>Período 15,6 µs; rajada STATUS0..ZDATA_L = 1 + 10 bytes: 11 µs a 8 MHz (86 % do barramento) ou 5,5 µs a 16 MHz (SPIM4 do nRF5340)</text><line x1='24' y1='62' x2='936' y2='62' stroke='#D3E0EB' stroke-width='1'/><rect x='172' y='66' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='100' x2='936' y2='100' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='93' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>amostra ADXL382 (64 kHz)</text><line x1='178' y1='154' x2='936' y2='154' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='147' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>INT0 (DATA_READY)</text><rect x='172' y='174' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='208' x2='936' y2='208' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='201' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>GPIOTE IN → DPPI</text><line x1='178' y1='262' x2='936' y2='262' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='255' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>SPIM 8 MHz: 11 B</text><rect x='172' y='282' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='316' x2='936' y2='316' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='309' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>SPIM 16 MHz: 11 B</text><line x1='178' y1='370' x2='936' y2='370' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='363' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>prazo do wrap (QUEUE)</text><line x1='178.0' y1='66' x2='178.0' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='253.8' y1='66' x2='253.8' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='329.6' y1='66' x2='329.6' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='405.4' y1='66' x2='405.4' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='481.2' y1='66' x2='481.2' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='557.0' y1='66' x2='557.0' y2='394' stroke='#D3E0EB' stroke-width='0.8' stroke-dasharray='1 5'/><line x1='632.8' y1='66' x2='632.8' y2='394' stroke='#D3E