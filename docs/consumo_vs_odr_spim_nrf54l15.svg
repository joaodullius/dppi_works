etica Neue, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600'>Menor consumo para uma taxa</text><text x='736' y='336' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Só o valor atual: LATEST, SPIM30.</text><text x='736' y='352' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Todas as amostras, ≤ 10 k/s:</text><text x='736' y='368' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>QUEUE por tempo, SPIM30 (9–88 µA).</text><text x='736' y='384' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Todas as amostras, &gt; 10 k/s:</text><text x='736' y='400' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>QUEUE com contador; a instância</text><text x='736' y='416' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>só muda a folga do barramento.</text><rect x='84' y='467' width='14' height='9' rx='2' fill='#1FA971'/><text x='103' y='476' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM30 (LP, P0)</text><rect x='210.77499999999998' y='467' width='14' height='9' rx='2' fill='#0093D0'/><text x='229.77499999999998' y='476' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM22 (PERI, P1)</text><rect x='349.52' y='467' width='14' height='9' rx='2' fill='#C94F4F'/><text x='368.52' y='476' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM00 (MCU, P2, 32 MHz)</text><text x='84' y='504' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10'>cheia = LATEST; pontilhada = QUEUE drenado por tempo (GRTC, sem TIMER; modelo, não implementado no repo); tracejada = QUEUE com contador TIMER (N = 64, implementado). Premissas: PERI 20 µA, LP 5 µA, MCU 300 µA, SPIM 0,25 / 0,8 mA, CPU 3,6 µs/amostra. Sem PPK2.</text></svg>