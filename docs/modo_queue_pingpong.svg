<text x='20' y='26' fill='#1f2937' font-weight='bold' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='16'>Modo QUEUE — EasyDMA array list em ping-pong, uma interrupção a cada N transações</text>
<text x='20' y='44' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>N = 4 para caber no desenho; 2N slots + N de folga. COMPARE1 rebobina o PTR (ISR zero-latency); EGU faz o trabalho da fila</text>
