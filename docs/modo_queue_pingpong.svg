-serif' font-size='11.5' font-weight='600'>(→ contador)</text><line x1='178' y1='154' x2='936' y2='154' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='147' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>contador (COUNT)</text><rect x='172' y='174' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='208' x2='936' y2='208' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='201' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>RXD.PTR (array list)</text><line x1='178' y1='262' x2='936' y2='262' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='242' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>COMPARE0 = N+1 / COMPARE1</text><text x='166' y='255' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>= 2N / COMPARE2 = 1</text><rect x='172' y='282' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='316' x2='936' y2='316' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='309' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>ISR zero-latency (wrap)</text><line x1='178' y1='370' x2='936' y2='370' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='363' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>EGU → ISR da fila</text><rect x='172' y='390' width='764' height='54' fill='#F3F7FB'/><line x1='178' y1='424' x2='936' y2='424' stroke='#D3E0EB' stroke-width='1'/><text x='166' y='417' text-anchor='end' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600'>k_msgq</text><l