 000</text><rect x='872.5' y='128.6' width='16' height='233.4' rx='2' fill='#1FA971' opacity='0.9'/><text transform='translate(883.5,124.6) rotate(-90)' fill='#1FA971' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' font-weight='600'>1343</text><rect x='891.5' y='128.8' width='16' height='233.2' rx='2' fill='#0093D0' opacity='0.9'/><text transform='translate(902.5,124.8) rotate(-90)' fill='#0093D0' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' font-weight='600'>1338</text><rect x='910.5' y='120.8' width='16' height='241.2' rx='2' fill='#C94F4F' opacity='0.9'/><text transform='translate(921.5,116.8) rotate(-90)' fill='#C94F4F' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5' font-weight='600'>1620</text><text x='899.5' y='377' text-anchor='middle' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>50 000</text><text x='796.0' y='392' text-anchor='middle' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10'>amostras por segundo</text><text x='20' y='102' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10'>µA, log</text><rect x='54' y='407' width='14' height='9' rx='2' fill='#1FA971'/><text x='73' y='416' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM30 (LP, P0)</text><rect x='180.77499999999998' y='407' width='14' height='9' rx='2' fill='#0093D0'/><text x='199.77499999999998' y='416' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM22 (PERI, P1)</text><rect x='319.52' y='407' width='14' height='9' rx='2' fill='#C94F4F'/><text x='338.52' y='416' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>SPIM00 (MCU, P2, 32 MHz)</text><rect x='54' y='428' width='882' height='78' rx='8' fill='#EDF3F8' stroke='#D3E0EB'/><text x='66' y='446' fill='#0B1B2B' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='11' font-weight='600'>Leitura</text><text x='66' y='463' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Instância: diferença constante — SPIM30 economiza 15 µA só em LATEST; SPIM00 custa +300 µA sempre.</text><text x='66' y='479' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Modo: N = 1 × N = 64 é a maior alavanca acima de 1 k/s (a RRAM acorda a cada amostra).</text><text x='66' y='495' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='10.5'>Abaixo de 2 k/s manda o contador (121 µA), igual em N = 1 e N = 64.</text><text x='54' y='536' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5'>Premissas: PERI ligado 20 µA (Academy), LP 5 µA (assumido), domínio MCU 300 µA (proxy TIMER00), SPIM ativa 0,25 mA (8 MHz) / 0,8 mA (32 MHz),</text><text x='54' y='550' fill='#566577' font-family='Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif' font-size='9.5'>contador TIMER21 121 µA, CPU 3,6 µs (N = 64) ou 21 µs (N = 1, com 13 µs de wake-up da RRAM) por amostra a 2,6 mA. Sem medição PPK2.</text></svg>