# Bench: wrap latency on the nRF54L15 TAG, M33 vs FLPR.
# Drain every 1 ms; at long periods the wrap ISR runs from idle (IRQ path),
# at short periods the drain waits awake for it. Latency printed per step.
CONFIG_APP_SAMPLE_PERIOD_US=1000
CONFIG_APP_WRAP_LATENCY_STATS=y
CONFIG_APP_SWEEP_PERIODS_US="1000,500,250,100,50,40,30,25,20"
CONFIG_APP_SWEEP_STEP_S=6
CONFIG_APP_DRAIN_PERIOD_US=1000
CONFIG_APP_RING_SLOTS=512
CONFIG_APP_QUEUE_DEPTH=1024
