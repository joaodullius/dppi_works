# Bench: one interrupt per sample (N = 1) on the nRF54L15 TAG, M33 vs FLPR.
# Every transaction costs a wrap ISR (every 2) + an EGU ISR + k_msgq_put + k_msgq_get.
# Sweep down until dropped/late appear; wrap latency printed per step.
CONFIG_APP_SAMPLE_PERIOD_US=1000
CONFIG_APP_CONSUME_QUEUE=y
CONFIG_APP_BLOCK_SAMPLES=1
CONFIG_APP_QUEUE_DEPTH=512
CONFIG_APP_WRAP_LATENCY_STATS=y
CONFIG_APP_SWEEP_PERIODS_US="1000,500,250,100,50,40,30,25,20"
CONFIG_APP_SWEEP_STEP_S=6
