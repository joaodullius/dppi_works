# Bench: bus ceiling on the nRF54L15 TAG. 17-byte BMI270 burst at 8 MHz = 17 us
# + CSN, so periods below ~19 us cannot be honored (START while busy is lost).
CONFIG_APP_SAMPLE_PERIOD_US=25
CONFIG_APP_CONSUME_QUEUE=y
CONFIG_APP_BLOCK_SAMPLES=64
CONFIG_APP_QUEUE_DEPTH=512
CONFIG_APP_QUEUE_FRESH_ONLY=y
CONFIG_APP_SWEEP_PERIODS_US="40,25,20,19,18,17,16"
CONFIG_APP_SWEEP_STEP_S=8
