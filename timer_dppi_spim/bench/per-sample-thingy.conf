# Bench: one interrupt per sample on the Thingy:53 (APP_PER_SAMPLE_IRQ), 11-byte
# burst at 8 MHz, down to the bus ceiling. Fresh filter on: queued/s = real ODR.
# Trigger -> END ISR latency printed per step (~12.5 us of transaction + ISR entry).
CONFIG_APP_PER_SAMPLE_IRQ=y
CONFIG_APP_SPI_FREQ_HZ=8000000
CONFIG_APP_SAMPLE_PERIOD_US=1000
CONFIG_APP_WRAP_LATENCY_STATS=y
CONFIG_APP_SWEEP_PERIODS_US="1000,250,100,50,40,30,25,20,16,15,14"
CONFIG_APP_SWEEP_STEP_S=6
CONFIG_APP_QUEUE_DEPTH=1024
CONFIG_APP_QUEUE_FRESH_ONLY=y
