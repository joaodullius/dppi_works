# Bench: bus throughput at the ADXL382 rate (64k transactions/s) on the Thingy:53.
# 11-byte burst at 8 MHz = 11 us + CSN (~12.5 us), period 15 us (66.7 kHz). The
# ADXL362 only produces ~372 new samples/s; the fresh filter keeps the queue at
# that rate. Wrap ISR latency printed per step.
CONFIG_APP_SAMPLE_PERIOD_US=15
CONFIG_APP_SPI_FREQ_HZ=8000000
CONFIG_APP_QUEUE_FRESH_ONLY=y
CONFIG_APP_WRAP_LATENCY_STATS=y
CONFIG_APP_SWEEP_PERIODS_US="100,50,25,20,16,15,14,12,11,10"
CONFIG_APP_SWEEP_STEP_S=8
CONFIG_APP_DRAIN_PERIOD_US=1000
CONFIG_APP_RING_SLOTS=512
CONFIG_APP_QUEUE_DEPTH=1024
