# Bench: bus throughput at the ADXL382 rate (64k transactions/s) on the Thingy:53.
# 11-byte burst at 8 MHz = 11 us + CSN, period 15 us (66.7 kHz). The ADXL362
# only produces ~380 new samples/s; the ISR filter keeps the queue at that rate.
CONFIG_APP_SAMPLE_PERIOD_US=15
CONFIG_APP_SPI_FREQ_HZ=8000000
CONFIG_APP_CONSUME_QUEUE=y
CONFIG_APP_BLOCK_SAMPLES=64
CONFIG_APP_QUEUE_DEPTH=512
CONFIG_APP_QUEUE_FRESH_ONLY=y
# 15 us skipped: in this regime (12.5 us transaction, ~2 us of slack) the build
# faults reproducibly about 1.5 s after entering it (see README, late wraps).
CONFIG_APP_SWEEP_PERIODS_US="25,20,16,14,12"
CONFIG_APP_SWEEP_STEP_S=8
