# Bench: one interrupt per sample on the nRF54L15 TAG (APP_PER_SAMPLE_IRQ), 17 B at 8 MHz.
# Sweep down until torn samples or a latency minimum below the transaction time
# (= ISR entering after the next START) appear. Trigger -> END ISR latency
# printed per step (~18.5 us of transaction + ISR entry).
CONFIG_APP_PER_SAMPLE_IRQ=y
CONFIG_APP_SAMPLE_PERIOD_US=1000
CONFIG_APP_WRAP_LATENCY_STATS=y
CONFIG_APP_SWEEP_PERIODS_US="1000,500,250,100,50,40,30,25,20,19"
CONFIG_APP_SWEEP_STEP_S=6
CONFIG_APP_QUEUE_DEPTH=1024
CONFIG_APP_QUEUE_FRESH_ONLY=y
