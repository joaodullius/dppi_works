CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# nrfx 4.0 (NCS 3.4.x): per-driver symbols only; instances come from devicetree,
# the DPPI driver was replaced by the GPPI helper layer.
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_GPPI=y

# The accelerometer bus is driven directly with nrfx: keep the Zephyr SPI and
# sensor drivers away from it.
CONFIG_SPI=n
CONFIG_SENSOR=n
CONFIG_MAIN_STACK_SIZE=4096
