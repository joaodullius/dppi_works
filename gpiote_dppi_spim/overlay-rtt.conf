# Bench logging over SEGGER RTT (J-Link on the debug-out connector) instead of
# the board's USB CDC ACM console (Thingy:53). Boards without a console
# (nRF54L15 TAG) get the same settings from boards/<board>.conf.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=4096
# Never block the log thread when no host is draining RTT.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# Report lines carry several doubles; the default 768-byte log thread stack overflows (UsageFault STKOF)
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# Bench: synchronous logging (the deferred log thread stalled under the 64k sweep; see README)
CONFIG_LOG_MODE_IMMEDIATE=y
