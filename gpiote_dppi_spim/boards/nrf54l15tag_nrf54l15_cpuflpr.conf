# The TAG has no UART: log over SEGGER RTT (J-Link on the DK debug-out)
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_I2C=n
# nRF54L15 errata 8 (SPIM, PRESCALER > 2, first bit 1): 8 MHz keeps PRESCALER = 2
CONFIG_APP_SPI_FREQ_HZ=8000000
# RXDELAY is in SPIM core clock cycles (16 MHz, 62.5 ns) on nRF54L; the reset
# value 2 = 125 ns = one full bit at 8 MHz, which samples the next bit.
CONFIG_APP_SPI_RX_DELAY=1
# Report lines carry several doubles; the default 768-byte log thread stack overflows (UsageFault STKOF)
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_MODE_IMMEDIATE=y
